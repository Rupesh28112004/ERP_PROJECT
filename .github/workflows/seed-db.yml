name: Seed Database on Deploy

on:
  workflow_dispatch: # Manual trigger from GitHub
  push:
    branches:
      - main
    paths:
      - 'project/backend/seed.js'
      - 'project/backend/models/**'

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd project/backend
          npm install

      - name: Seed database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cd project/backend
          npm run seed
        continue-on-error: true # Don't fail if already seeded

      - name: Log result
        run: echo "Database seeding attempt completed"
